<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED"/>
      <stop offset="100%" style="stop-color:#EC4899"/>
    </linearGradient>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="2" fill="rgba(255,255,255,0.1)"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" fill="url(#dots)"/>
  <g transform="translate(960, 400)">
    <circle cx="0" cy="0" r="80" fill="rgba(255,255,255,0.2)"/>
    <circle cx="-150" cy="100" r="40" fill="rgba(255,255,255,0.15)"/>
    <circle cx="180" cy="80" r="60" fill="rgba(255,255,255,0.15)"/>
    <circle cx="-200" cy="-50" r="30" fill="rgba(245,158,11,0.3)"/>
    <circle cx="250" cy="-80" r="50" fill="rgba(236,72,153,0.3)"/>
  </g>
  <text x="960" y="540" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle">Event Organizer</text>
  <text x="960" y="600" font-family="Arial, sans-serif" font-size="24" fill="rgba(255,255,255,0.8)" text-anchor="middle">Creating Memorable Moments</text>
</svg>
